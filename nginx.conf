worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # servicios users
    upstream user_services {
        server users:8000;
        keepalive 16;
    }
    # serviicios core
    upstream core_services{
        server core:8001;
        keepalive 16;
    }

    limit_req_zone "test" zone=health_limit:2m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=3r/s;

    # Mapas de validación
    map $http_x_api_key $missing_api_key {
        "" 1;
        "~^\s*$" 1;
        default 0;
    }

    map $http_x_origin $missing_origin {
        "" 1;
        "~^\s*$" 1;
        default 0;
    }

    server {
        listen 80;
        server_name localhost;

        limit_req_status 429;

        location /check {
            add_header Content-Type text/plain;
            return 200 'Getaway OK';
        }

        # requisitos de ruta core si funciona voy a ordenarlos
        location = /core/api/v1{
            return 301 /core/api/v1/;
        }
        # parte del core
        location /core/api/v1/ {
            if ($missing_api_key) { return 401 "x-api-key is required";}
            if ($missing_origin) { return 401 "x-origin is required";}

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-API-KEY $http_x_api_key;
            proxy_set_header X-ORIGIN $http_x_origin;
            proxy_pass http://core_services/;
        }

        # requisitos de la ruta users
        location /user/api/v1/ {
            if ($missing_api_key) { return 401 "x-api-key is required"; }
            if ($missing_origin) { return 401 "x-origin is required"; }

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-API-KEY $http_x_api_key;
            proxy_set_header X-ORIGIN $http_x_origin;
            proxy_pass http://user_services/;
        }


        location = /user/api/v1 {
            return 301 /user/api/v1/;
        }
        
        # req para docs
        location = /user/api/v1/docs {
            return 301 /user/api/v1/docs/;
        }
        # para schema
        location = /schema {
            return 301 /schema/;
        }

        location /schema/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://user_services/schema/;
        }

        location /user/api/v1/docs/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://user_services/gateway-docs/;
        }

        location = /user/api/v1/schema {
            return 301 /user/api/v1/schema/;
        }

        location /user/api/v1/schema/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://user_services/schema/;
        }


        location /user/api/v1 {
            if ($missing_api_key) { return 401 "x-api-key is required"; }
            if ($missing_origin) { return 401 "x-origin is required"; }

            add_header Content-Type text/plain;
            return 200 'User API OK';
        }

        #esto de prueba cuando se incio el proyecto
        location /user/api/v2 {
            if ($missing_api_key) { return 401 "x-api-key is required"; }
            if ($missing_origin) { return 401 "x-origin is required"; }

            add_header Content-Type text/plain;
            return 200 'User API v2 OK';
        }

        location / {
            add_header Content-Type text/plain;
            return 404 'Not Found';
        }
    }
}